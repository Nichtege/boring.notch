name: Windows test

on:
  push:
    branches: [windows]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # A sound card for the Mixer, which runners don't have. The test still runs without one.
      - name: Virtual sound card
        uses: LABSN/sound-ci-helpers@d08c889a7bba7d9b1b059f8f76dac4672ea3a9cf
        continue-on-error: true
      - name: Windows Search, on as on a normal PC
        continue-on-error: true
        shell: powershell
        run: ci\searchprobe.ps1 -Out "$PWD\out\echt"
      - name: Logic tests
        run: dotnet run --project tests -c Release
      - name: Build
        run: dotnet build BoringNotch.csproj -c Release
      - name: Keep only the exe, as it's sent
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist, out | Out-Null
          Copy-Item bin/Release/net48/BoringNotch.exe dist/
      - name: A player for the self test to find
        shell: powershell
        run: |
          $p = Start-Process powershell -ArgumentList '-STA', '-File', "$PWD\ci\media.ps1", '-Log', "$PWD\out\selftest-player.log" -WindowStyle Hidden -PassThru
          Set-Content -Path "$PWD\out\selftest-player.pid" -Value $p.Id
          Start-Sleep -Seconds 5
      - name: Self test
        shell: powershell
        run: |
          $env:NOTCH_TEST_MEDIA = '1'
          $p = Start-Process "$PWD\dist\BoringNotch.exe" -ArgumentList '--selftest', "$PWD\out\selftest" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Output 'Hung'; exit 1 }
          Get-Content "$PWD\out\selftest\bericht.txt" -ErrorAction SilentlyContinue
          $code = $p.ExitCode
          Stop-Process -Id (Get-Content "$PWD\out\selftest-player.pid") -Force -ErrorAction SilentlyContinue
          exit $code
      - name: Real use, with the mouse and keyboard
        if: success() || failure()
        shell: powershell
        run: ci\drive.ps1 -Exe "$PWD\dist\BoringNotch.exe" -Out "$PWD\out\echt"
      - name: A real browser playing a song with a cover
        if: success() || failure()
        shell: powershell
        run: |
          $folder = "$PWD\out\browser"
          New-Item -ItemType Directory -Force $folder | Out-Null
          $server = Start-Process powershell -ArgumentList '-File', "$PWD\ci\browser.ps1", '-Folder', $folder -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 8
          $chrome = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
          $browser = Start-Process $chrome -ArgumentList '--autoplay-policy=no-user-gesture-required', '--no-first-run', '--no-default-browser-check', "--user-data-dir=$env:TEMP\notch-chrome", '--new-window', 'http://localhost:8765/' -PassThru
          Start-Sleep -Seconds 12
          $env:NOTCH_TEST_MEDIA = '1'
          $env:NOTCH_TEST_COVER = '1'
          $env:NOTCH_TEST_ONLY_APP = '1'
          $noise = Start-Process powershell -ArgumentList '-File', "$PWD\ci\noise.ps1" -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 3
          $p = Start-Process "$PWD\dist\BoringNotch.exe" -ArgumentList '--selftest', $folder -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Output 'Hung'; exit 1 }
          Get-Content "$folder\bericht.txt" -ErrorAction SilentlyContinue
          $code = $p.ExitCode
          if (Test-Path "$folder\browser-skips.log") { Write-Output 'The skip button reached the browser.' } else { Write-Output 'The skip button did NOT reach the browser.'; $code = 1 }
          Get-Process chrome -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $noise.Id -Force -ErrorAction SilentlyContinue
          exit $code
      - name: At 150 percent scale
        if: success() || failure()
        shell: powershell
        run: ci\scale.ps1 -Exe "$PWD\dist\BoringNotch.exe" -Out "$PWD\out\skaliert"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ergebnis
          path: |
            dist
            out
